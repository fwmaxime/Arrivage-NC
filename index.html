<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ARRIVAGE revient bientôt</title>
<meta name="description" content="ARRIVAGE, tout ce qui débarque, au même endroit. Le site revient très bientôt.">
<meta name="theme-color" content="#203C31">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23203C31%27/%3E%3Ctext x=%2714%27 y=%2746%27 font-family=%27Arial,sans-serif%27 font-weight=%27800%27 font-size=%2738%27 fill=%27%23F5F5F1%27%3Ea%3C/text%3E%3Ccircle cx=%2748%27 cy=%2742%27 r=%275%27 fill=%27%23E77938%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root { --green: #203C31; --orange: #E77938; --paper: #F5F5F1; --soft: #C5D1C9; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--green);
    color: var(--paper);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    min-height: 100vh; min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(60vmax 60vmax at 110% -10%, rgba(231,121,56,.20), transparent 60%),
      radial-gradient(50vmax 50vmax at -20% 120%, rgba(255,255,255,.06), transparent 60%);
  }
  main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 720px; width: 100%; margin: 0 auto; }
  .logo { font-family: "Bricolage Grotesque", "Inter", sans-serif; font-weight: 800; letter-spacing: -0.045em; line-height: .9; font-size: clamp(56px, 14vw, 128px); margin: 0; }
  .logo span { color: var(--orange); }
  .slogan { font-family: "Bricolage Grotesque", "Inter", sans-serif; font-weight: 600; font-size: clamp(20px, 4.2vw, 30px); letter-spacing: -0.02em; line-height: 1.2; margin: 22px 0 0; text-wrap: balance; }
  .badge { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; margin-bottom: 28px; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #F0A274; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 0 rgba(231,121,56,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(231,121,56,0); } 100% { box-shadow: 0 0 0 0 rgba(231,121,56,0); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .text { color: var(--soft); font-size: 16.5px; line-height: 1.6; max-width: 34em; margin: 18px 0 0; }
  .cta { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; margin-top: 34px; padding: 14px 22px; border-radius: 14px; background: var(--orange); color: #fff; font-weight: 600; font-size: 15.5px; text-decoration: none; transition: transform .15s ease, background .15s ease; word-break: break-all; }
  .cta:hover { background: #d96a2a; transform: translateY(-1px); }
  .cta:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
  .cta svg { flex-shrink: 0; }
  footer { position: relative; max-width: 720px; width: 100%; margin: 0 auto; padding-top: 32px; font-size: 13px; color: rgba(245,245,241,.55); }
</style>
</head>
<body>
<main>
  <div class="badge"><span class="dot" aria-hidden="true"></span>Bientôt de retour</div>
  <h1 class="logo" aria-label="arrivage.">arrivage<span>.</span></h1>
  <p class="slogan">Tout ce qui débarque, au même endroit.</p>
  <p class="text">On prépare l'arrivée d'ARRIVAGE en Nouvelle-Calédonie. Le site revient très bientôt. Une question, ou envie de référencer votre commerce&nbsp;? Écrivez-nous.</p>
  <a class="cta" href="mailto:contact@arrivagenc.com">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
    contact@arrivagenc.com
  </a>
</main>
<footer>© 2026 ARRIVAGE · Nouvelle-Calédonie</footer>
</body>
</html>
